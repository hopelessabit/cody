spring.application.name=cody-app

spring.config.import=optional:file:key.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL}

# ===============================
# JWT Configuration
# ===============================
jwtKey=${SECRET_KEY}
jwtExpired=${EXPIRATION}
refresh_token_expiration=${REFRESH_TOKEN_EXPIRATION}

# ===============================
# Swagger Configuration
# ===============================
# Default configuration (production)
#app.swagger.default-server=http://localhost:8080

# Production configuration
#spring.profiles.active=dev

# Add reverse proxy configuration
#server.forward-headers-strategy=framework
#server.use-forward-headers=true

# Trust proxy headers for proper HTTPS detection
#server.tomcat.remote-ip-header=x-forwarded-for
#server.tomcat.protocol-header=x-forwarded-proto
#server.tomcat.protocol-header-https-value=https

# ===============================
# Logging Configuration
# ===============================
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# Timezone and Date Format
# ===============================
spring.jpa.properties.hibernate.jdbc.time_zone=${SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_TIME_ZONE}
spring.jackson.date-format=${SPRING_JACKSON_DATE_FORMAT}
spring.jackson.time-zone=${SPRING_JACKSON_TIME_ZONE}
